stages:
  - build
  - test
  - release

variables:
  # Reference the image by its unique commit SHA during the pipeline
  TEST_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# 1. BUILD: Build and push the unique SHA image
build-ansible-ci:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$TEST_IMAGE"
      --cache=true
      --cache-ttl=168h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([-.].*)?$/'

# 2. TEST: Verify the "Golden Image" is actually functional
test-ansible-ci:
  stage: test
  tags:
    - docker
  image: 
    name: "$TEST_IMAGE"
    pull_policy: always
  script:
    - echo "Verifying Image Integrity..."
    - ansible --version
    - docker-compose version
    - zensical --version
    # NEW: Verify cryptography tooling
    - echo "Verifying SOPS and Age..."
    - sops --version
    - age --version
    - |
      echo "Checking Mitogen strategy path..."
      if [ ! -f "/plugins/mitogen/ansible_mitogen/plugins/strategy/mitogen_linear.py" ]; then
        echo "ERROR: Mitogen strategy file not found at expected path!"
        exit 1
      fi
    - echo "Checking Python dependencies..."
    - python3 -c "import passlib; import yaml; print('Dependencies OK')"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([-.].*)?$/'

release-images:
  stage: release
  tags:
    - docker
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      RELEASE_VERSION=""

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        RELEASE_VERSION="$(awk -F'"' '/^__version__/ {print $2}' version.py)"
        if [ -z "$RELEASE_VERSION" ]; then
          echo "ERROR: Could not read __version__ from version.py"
          exit 1
        fi
      elif printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$'; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      fi

      RELEASE_MINOR="$(printf '%s' "$RELEASE_VERSION" | cut -d. -f1,2)"

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Publishing latest tag from main..."
        crane tag "$TEST_IMAGE" latest
      fi
      if [ -n "$RELEASE_VERSION" ] && ! crane manifest "$CI_REGISTRY_IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
        echo "Publishing release tags for ${RELEASE_VERSION}..."
        crane tag "$TEST_IMAGE" "$RELEASE_VERSION"
        crane tag "$TEST_IMAGE" "$RELEASE_MINOR"
      elif [ -n "$RELEASE_VERSION" ]; then
        echo "Pinned tag ${RELEASE_VERSION} already exists; leaving it unchanged."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([-.].*)?$/'

# NEW: Trigger the Template Engine to rebuild using the fresh base image
trigger-engine-rebuild:
  stage: release
  tags:
    - docker
  image: curlimages/curl:latest
  needs: [release-images]
  script:
    - |
      echo "🚀 Base image updated. Triggering Template Engine rebuild..."
      curl --request POST \
        --form token=$ENGINE_REBUILD_TOKEN \
        --form ref=main \
        --form "variables[TRIGGER_SOURCE]=base-image-update" \
        "https://gitlab.int.fam-feser.de/api/v4/projects/105/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'