stages:
  - build
  - test
  - release-tag
  - release

variables:
  # Reference the image by its unique commit SHA during the pipeline
  TEST_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  GITHUB_REPO: "https://github.com/lyndrix-platform/ansible-ci-image"

# 1. BUILD: Build and push the unique SHA image
build-ansible-ci:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$TEST_IMAGE"
      --cache=true
      --cache-ttl=168h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 2. TEST: Verify the "Golden Image" is actually functional
test-ansible-ci:
  stage: test
  tags:
    - docker
  image: 
    name: "$TEST_IMAGE"
    pull_policy: always
  script:
    - echo "Verifying Image Integrity..."
    - ansible --version
    - docker-compose version
    - zensical --version
    # NEW: Verify cryptography tooling
    - echo "Verifying SOPS and Age..."
    - sops --version
    - age --version
    - |
      echo "Checking Mitogen strategy path..."
      if [ ! -f "/plugins/mitogen/ansible_mitogen/plugins/strategy/mitogen_linear.py" ]; then
        echo "ERROR: Mitogen strategy file not found at expected path!"
        exit 1
      fi
    - echo "Checking Python dependencies..."
    - python3 -c "import passlib; import yaml; print('Dependencies OK')"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

create-release-tag:
  stage: release-tag
  tags:
    - docker
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  resource_group: create-release-tag
  needs: ["test-ansible-ci"]
  script:
    - VERSION="$(awk -F'"' '/^__version__/ {print $2}' version.py)"
    - |
      if [ -z "$VERSION" ]; then
        echo "ERROR: Could not read __version__ from version.py"
        exit 1
      fi
    - TAG="v${VERSION#v}"
    - echo "Ensuring release tag ${TAG} exists..."
    - git fetch --tags origin
    - |
      if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
        echo "Tag ${TAG} already exists. Nothing to do."
        exit 0
      fi
    - git config user.name "${GITLAB_USER_NAME:-CI Release Bot}"
    - git config user.email "${GITLAB_USER_EMAIL:-ci-release-bot@local}"
    - git tag -a "$TAG" -m "Release $TAG"
    - |
      JOB_TOKEN_PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      FALLBACK_PUSH_TOKEN="${RELEASE_TAG_PUSH_TOKEN:-$CI_GLOBAL_TOKEN}"
      FALLBACK_PUSH_USER="${RELEASE_TAG_PUSH_USER:-oauth2}"
      FALLBACK_PUSH_URL="https://${FALLBACK_PUSH_USER}:${FALLBACK_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

      echo "Trying tag push with CI_JOB_TOKEN first..."
      if git push "$JOB_TOKEN_PUSH_URL" "refs/tags/$TAG"; then
        echo "Tag push with CI_JOB_TOKEN succeeded."
        exit 0
      fi

      if [ -n "$FALLBACK_PUSH_TOKEN" ]; then
        echo "CI_JOB_TOKEN push failed. Trying fallback token..."
        git push "$FALLBACK_PUSH_URL" "refs/tags/$TAG"
        exit 0
      fi

      echo "ERROR: CI_JOB_TOKEN push failed and no fallback token is set."
      echo "Enable CI job token write_repository or set RELEASE_TAG_PUSH_TOKEN/CI_GLOBAL_TOKEN."
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

trigger-github-release:
  stage: release-tag
  tags:
    - docker
  image: curlimages/curl:8.20.0
  needs: ["create-release-tag"]
  script:
    - VERSION="$(awk -F'"' '/^__version__/ {print $2}' version.py)"
    - |
      if [ -z "$VERSION" ]; then
        echo "ERROR: Could not read __version__ from version.py"
        exit 1
      fi
    - TAG="v${VERSION#v}"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "GITHUB_REPO is not configured. Skipping GitHub workflow dispatch."
        exit 0
      fi

      GITHUB_REPO_PATH="$GITHUB_REPO"
      GITHUB_REPO_PATH="${GITHUB_REPO_PATH#https://github.com/}"
      GITHUB_REPO_PATH="${GITHUB_REPO_PATH#http://github.com/}"
      GITHUB_REPO_PATH="${GITHUB_REPO_PATH#git@github.com:}"
      GITHUB_REPO_PATH="${GITHUB_REPO_PATH%.git}"

      if ! printf '%s' "$GITHUB_REPO_PATH" | grep -Eq '^[^/]+/[^/]+$'; then
        echo "ERROR: GITHUB_REPO must be owner/repo or a github.com URL. Current value: $GITHUB_REPO"
        exit 1
      fi

      if [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_TOKEN is not configured. Skipping GitHub workflow dispatch."
        exit 0
      fi
    - WORKFLOW_FILE="${GITHUB_RELEASE_WORKFLOW:-release.yml}"
    - echo "Dispatching GitHub workflow ${WORKFLOW_FILE} for ${GITHUB_REPO_PATH} (tag ${TAG})..."
    - |
      curl --fail-with-body --request POST \
        --url "https://api.github.com/repos/${GITHUB_REPO_PATH}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --data "{\"ref\":\"main\",\"inputs\":{\"release_tag\":\"${TAG}\",\"source_sha\":\"${CI_COMMIT_SHA}\"}}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

release-images:
  stage: release
  tags:
    - docker
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      RELEASE_VERSION=""

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        RELEASE_VERSION="$(awk -F'"' '/^__version__/ {print $2}' version.py)"
        if [ -z "$RELEASE_VERSION" ]; then
          echo "ERROR: Could not read __version__ from version.py"
          exit 1
        fi
      fi

      RELEASE_MINOR="$(printf '%s' "$RELEASE_VERSION" | cut -d. -f1,2)"

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Publishing latest tag from main..."
        crane tag "$TEST_IMAGE" latest
      fi
      if [ -n "$RELEASE_VERSION" ] && ! crane manifest "$CI_REGISTRY_IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
        echo "Publishing release tags for ${RELEASE_VERSION}..."
        crane tag "$TEST_IMAGE" "$RELEASE_VERSION"
        crane tag "$TEST_IMAGE" "$RELEASE_MINOR"
      elif [ -n "$RELEASE_VERSION" ]; then
        echo "Pinned tag ${RELEASE_VERSION} already exists; leaving it unchanged."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# NEW: Trigger the Template Engine to rebuild using the fresh base image
trigger-engine-rebuild:
  stage: release
  tags:
    - docker
  image: curlimages/curl:latest
  needs: [release-images]
  script:
    - |
      echo "🚀 Base image updated. Triggering Template Engine rebuild..."
      curl --request POST \
        --form token=$ENGINE_REBUILD_TOKEN \
        --form ref=main \
        --form "variables[TRIGGER_SOURCE]=base-image-update" \
        "https://gitlab.int.fam-feser.de/api/v4/projects/105/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'